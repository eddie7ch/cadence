server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames make the content immutable, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The SPA owns its routes: a deep link such as /activities/<guid> is not a
    # file on disk, so anything that is not an asset falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached, or a deploy serves stale asset URLs.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    error_page 404 /index.html;
}
